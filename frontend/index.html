<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeaveFlow - Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand">
        <h1>LeaveFlow</h1>
        <p>Sign in to your account</p>
      </div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@company.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <div class="form-group">
          <label for="role">Login as</label>
          <select id="role">
            <option value="employee">Employee</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <div class="auth-footer">
        Don't have an account? <a href="pages/register.html">Register</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      const role = document.getElementById('role').value;
      // TODO: replace with fetch(`${API_BASE}/auth/login`, {...})
      if (role === 'admin') window.location.href = 'pages/admin-dashboard.html';
      else window.location.href = 'pages/dashboard.html';
    }
  </script>
</body>
</html>
