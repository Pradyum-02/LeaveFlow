<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeaveFlow - Apply Leave</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <script src="../js/app.js"></script>
  <script>
    const content = `
      <div class="panel" style="max-width:640px;">
        <h2>Apply for Leave</h2>
        <form onsubmit="submitLeave(event)">
          <div class="form-group">
            <label>Leave Type</label>
            <select id="leaveType" required>
              <option value="">Select leave type</option>
              <option>Sick Leave</option>
              <option>Casual Leave</option>
              <option>Earned Leave</option>
              <option>Maternity Leave</option>
              <option>Paternity Leave</option>
            </select>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group">
              <label>Start Date</label>
              <input type="date" id="startDate" required />
            </div>
            <div class="form-group">
              <label>End Date</label>
              <input type="date" id="endDate" required />
            </div>
          </div>
          <div class="form-group">
            <label>Reason</label>
            <textarea id="reason" placeholder="Briefly describe the reason for leave..." required></textarea>
          </div>
          <div class="actions-row">
            <button type="submit" class="btn btn-primary">Submit Request</button>
            <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    `;
    mountLayout({ active: 'apply', title: 'Apply Leave', role: 'employee', content });

async function submitLeave(e) {

    e.preventDefault();

    const token = localStorage.getItem("token");

    const leaveType = document.getElementById("leaveType").value;
    const startDate = document.getElementById("startDate").value;
    const endDate = document.getElementById("endDate").value;
    const reason = document.getElementById("reason").value;

    const start = new Date(startDate);
    const end = new Date(endDate);

    const days =
        Math.floor((end - start) / (1000 * 60 * 60 * 24)) + 1;

    if (days <= 0) {
        alert("End Date must be after Start Date.");
        return;
    }

    try {

        const response = await fetch(`${API_BASE}/leaves`, {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`
            },

            body: JSON.stringify({

                leaveType,
                startDate,
                endDate,
                reason,
                days

            })

        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message);
            return;
        }

        alert("Leave request submitted successfully!");

        window.location.href = "leave-history.html";

    } catch (error) {

        console.error(error);

        alert("Unable to connect to server.");

    }

}
  </script>
</body>
</html>
