<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeaveFlow - Profile</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <script src="../js/app.js"></script>
<script>

const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
    window.location.href = "../index.html";
}

const content = `

<div class="panel">

    <div class="profile-card">

        <div class="avatar">

            ${initials(user.fullName)}

        </div>

        <div class="profile-info">

            <h3>${user.fullName}</h3>

            <p>

                ${user.department} · ${user.employeeId}

            </p>

        </div>

    </div>

    <div class="info-grid">

        <div class="info-item">

            <div class="k">Full Name</div>

            <div class="v">${user.fullName}</div>

        </div>

        <div class="info-item">

            <div class="k">Employee ID</div>

            <div class="v">${user.employeeId}</div>

        </div>

        <div class="info-item">

            <div class="k">Department</div>

            <div class="v">${user.department}</div>

        </div>

        <div class="info-item">

            <div class="k">Email</div>

            <div class="v">${user.email}</div>

        </div>

        <div class="info-item">

            <div class="k">Role</div>

            <div class="v" style="text-transform:capitalize;">

                ${user.role}

            </div>

        </div>

    </div>

</div>

`;

mountLayout({

    active: "profile",

    title: "My Profile",

    role: user.role,

    content

});

</script>
</body>
</html>
