<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeaveFlow - Employees</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <script src="../js/app.js"></script>
  <script>
    const content = `
      <div class="panel">
        <h2>All Employees</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Employee Name</th>
                <th>Employee ID</th>
                <th>Department</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody>
              ${EMPLOYEES.map(e => `
                <tr>
                  <td>
                    <div style="display:flex;align-items:center;gap:10px;">
                      <div class="avatar" style="width:32px;height:32px;font-size:12px;">${initials(e.name)}</div>
                      ${e.name}
                    </div>
                  </td>
                  <td>${e.id}</td>
                  <td>${e.department}</td>
                  <td>${e.email}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
    mountLayout({ active: 'employees', title: 'Employees', role: 'admin', content });
  </script>
</body>
</html>
