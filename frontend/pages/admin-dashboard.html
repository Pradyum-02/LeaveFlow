<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeaveFlow - Admin Dashboard</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <script src="../js/app.js"></script>
  <script>
    const totalEmp = EMPLOYEES.length;
    const pending = ADMIN_REQUESTS.filter(r => r.status === 'Pending').length;
    const approved = ADMIN_REQUESTS.filter(r => r.status === 'Approved').length;
    const rejected = ADMIN_REQUESTS.filter(r => r.status === 'Rejected').length;

    const content = `
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Total Employees</div><div class="value">${totalEmp}</div></div>
        <div class="stat-card warn"><div class="label">Pending Leaves</div><div class="value">${pending}</div></div>
        <div class="stat-card success"><div class="label">Approved Leaves</div><div class="value">${approved}</div></div>
        <div class="stat-card danger"><div class="label">Rejected Leaves</div><div class="value">${rejected}</div></div>
      </div>

      <div class="panel">
        <h2>Recent Leave Requests</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Employee</th><th>Department</th><th>Type</th><th>Dates</th><th>Status</th></tr>
            </thead>
            <tbody>
              ${ADMIN_REQUESTS.slice(0,5).map(r => `
                <tr>
                  <td>${r.name} <div style="color:var(--text-muted);font-size:12px;">${r.empId}</div></td>
                  <td>${r.dept}</td>
                  <td>${r.type}</td>
                  <td>${r.start} → ${r.end}</td>
                  <td>${badge(r.status)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
    mountLayout({ active: 'admin-dashboard', title: 'Admin Dashboard', role: 'admin', content });
  </script>
</body>
</html>
