<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeaveFlow - Manage Leave Requests</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <script src="../js/app.js"></script>
<script>

let allLeaves = [];

async function loadManageLeaves() {

    const token = localStorage.getItem("token");
    const user = JSON.parse(localStorage.getItem("user"));

    if (!token || !user) {
        window.location.href = "../index.html";
        return;
    }

    try {

        const response = await fetch(`${API_BASE}/leaves`, {

            headers: {
                Authorization: `Bearer ${token}`
            }

        });

        allLeaves = await response.json();

        if (!response.ok) {
            alert(allLeaves.message);
            return;
        }

        renderPage();

    } catch (error) {

        console.error(error);

        alert("Unable to load leave requests.");

    }

}

function renderPage() {

    const content = `

    <div class="panel">

        <h2>All Leave Requests</h2>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>Employee</th>
                        <th>Employee ID</th>
                        <th>Department</th>
                        <th>Leave Type</th>
                        <th>Dates</th>
                        <th>Days</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody>

                ${

                allLeaves.map(leave=>`

                <tr>

                    <td>${leave.employeeName}</td>

                    <td>${leave.employeeId}</td>

                    <td>${leave.department}</td>

                    <td>${leave.leaveType}</td>

                    <td>

                    ${new Date(leave.startDate).toLocaleDateString()}

                    →

                    ${new Date(leave.endDate).toLocaleDateString()}

                    </td>

                    <td>${leave.days}</td>

                    <td>${leave.reason}</td>

                    <td>${badge(leave.status)}</td>

                    <td>

                    ${leave.status==="Pending"

                    ?

                    `<div class="actions-row">

                    <button
                    class="btn btn-success btn-sm"
                    onclick="updateLeave('${leave._id}','Approved')">

                    Approve

                    </button>

                    <button
                    class="btn btn-danger btn-sm"
                    onclick="updateLeave('${leave._id}','Rejected')">

                    Reject

                    </button>

                    </div>`

                    :

                    `<span style="color:var(--text-muted);">—</span>`

                    }

                    </td>

                </tr>

                `).join("")

                }

                </tbody>

            </table>

        </div>

    </div>

    `;

    mountLayout({

        active:"manage",

        title:"Manage Leave Requests",

        role:"admin",

        content

    });

}

async function updateLeave(id,status){

    const token = localStorage.getItem("token");

    try{

        const response = await fetch(`${API_BASE}/leaves/${id}`,{

            method:"PATCH",

            headers:{
                "Content-Type":"application/json",
                Authorization:`Bearer ${token}`
            },

            body:JSON.stringify({

                status

            })

        });

        const data = await response.json();

        if(!response.ok){

            alert(data.message);

            return;

        }

        await loadManageLeaves();

    }

    catch(error){

        console.error(error);

        alert("Unable to update leave.");

    }

}

loadManageLeaves();

</script>
</body>
</html>
